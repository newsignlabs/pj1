# Upload photos to any folder in images-src/ on main (for example with GitHub's
# "Add file > Upload files"), or delete them, and this workflow prepares the pictures,
# makes the WebP images, rebuilds the pages and commits the result. Catalyst Slate then
# publishes the site. Folder guide: README.md "Updating photos".
name: Build site from photo folders

on:
  push:
    branches: [main]
    paths:
      - "images-src/**"
      - "content/collections.json"
      - "tools/**"
      - "assets/css/**"
      - "assets/js/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-collections
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: "newest photo in a folder wins" uses commit dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image libraries
        run: pip install Pillow pillow-heif numpy

      - name: Prepare slider, quote, category, Our Story, feature and logo photos
        run: python tools/build_slots.py

      - name: Make WebP images (removes images of deleted photos)
        run: python tools/optimize_images.py --prune

      - name: Rebuild collections.html
        run: python tools/build_collections.py

      - name: Version CSS/JS links so browsers fetch changed files
        run: python tools/stamp_assets.py

      - name: Check the site
        run: python tools/check_site.py

      - name: Commit generated files
        run: |
          git add -A images-src assets *.html
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build site from uploaded photos"
          git pull --rebase origin main
          git push origin HEAD:main
